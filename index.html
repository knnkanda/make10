<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Make 10 Puzzle for Kids</title>
<style>
  body {
    background-color: #f0f8ff;
    color: #333;
    font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px 10px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* スマホでのスワイプによる画面スクロールを防止 */
  }
  h1 { margin-bottom: 5px; font-size: 28px; color: #ff6b6b; text-shadow: 2px 2px 0px #ffd93d; letter-spacing: 2px;}
  p.desc { color: #555; margin-bottom: 15px; font-size: 14px; text-align: center; font-weight: bold;}
  
  #game-container { display: flex; gap: 15px; }
  
  #board {
    background-color: #e0f2fe;
    border: 6px solid #38bdf8;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0) translateY(0); }
    25% { transform: translateX(-4px) translateY(3px) rotate(-1deg); }
    50% { transform: translateX(4px) translateY(-3px) rotate(1deg); }
    75% { transform: translateX(-4px) translateY(-3px) rotate(0deg); }
  }
  .board-shake {
    animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
  }

  .cell {
    position: absolute;
    width: 50px; /* スマホ向けに少し縮小 */
    height: 50px;
    box-sizing: border-box;
    border: 3px solid rgba(255,255,255,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    font-size: 24px;
    color: #fff;
    border-radius: 12px;
    transition: top 0.15s ease-in, left 0.1s;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.3);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  
  @keyframes explode {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.4) rotate(15deg); filter: brightness(1.5); box-shadow: 0 0 30px #fff, 0 0 60px #ff9f43; z-index: 100; }
    100% { transform: scale(0) rotate(-15deg); filter: brightness(2); opacity: 0; }
  }
  
  .cell.flash {
    animation: explode 0.5s forwards;
    background-color: #fff !important;
    color: #ff9f43 !important;
    border-color: #fff;
  }

  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 50;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
  }

  #ui-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 90px;
  }

  .panel-box {
    background-color: #fff;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    border: 4px solid #fca311;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  
  .panel-box h3 { margin: 0 0 5px 0; font-size: 14px; color: #fca311; }
  .panel-box h3.small { font-size: 11px; }
  
  #score { font-size: 22px; font-weight: bold; color: #ff595e; }
  
  #next-container, #next-next-container {
    width: 50px; height: 50px;
    margin: 0 auto;
    position: relative;
  }

  /* スマホ用操作ボタンのスタイル */
  #mobile-controls {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    justify-content: center;
    width: 100%;
  }

  .control-btn {
    width: 70px;
    height: 70px;
    font-size: 32px;
    background-color: #38bdf8;
    color: white;
    border: none;
    border-radius: 50%;
    box-shadow: 0 6px 0 #0284c7, 0 8px 10px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .control-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #0284c7, 0 2px 4px rgba(0,0,0,0.2);
  }

  .controls { margin-top: 15px; text-align: center; color: #888; font-size: 12px; font-weight: bold; line-height: 1.6;}
  
  @media (max-width: 600px) {
    .controls { display: none; } /* スマホではキーボードの説明を隠す */
  }
</style>
</head>
<body>

<h1>Make 10 パズル</h1>
<p class="desc">縦かくっつけて「10」を作ろう！</p>

<div id="game-container">
  <div id="board"></div>
  <div id="ui-panel">
    <div class="panel-box">
      <h3>スコア</h3>
      <div id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>つぎ</h3>
      <div id="next-container"></div>
    </div>
    <div class="panel-box">
      <h3 class="small">つぎのつぎ</h3>
      <div id="next-next-container"></div>
    </div>
  </div>
</div>

<!-- スマホ用操作ボタン -->
<div id="mobile-controls">
  <button class="control-btn" id="btn-left">◀</button>
  <button class="control-btn" id="btn-down">▼</button>
  <button class="control-btn" id="btn-right">▶</button>
</div>

<div class="controls">
  [ ← ] [ → ] : 左右にうごかす<br>
  [ ↓ ] : はやくおとす
</div>

<script>
  const COLS = 6;
  const ROWS = 10;
  const CELL_SIZE = 50; /* スマホ画面に収まるようマスを60から50に変更 */
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const nextContainer = document.getElementById('next-container');
  const nextNextContainer = document.getElementById('next-next-container');
  
  boardEl.style.width = (COLS * CELL_SIZE) + 'px';
  boardEl.style.height = (ROWS * CELL_SIZE) + 'px';

  let board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  let score = 0;
  
  const numbersPool = [1, 2, 3, 4, 5, 6, 7, 8, 9];

  function getRandomNumber() {
    return numbersPool[Math.floor(Math.random() * numbersPool.length)];
  }

  function getColor(val) {
    const colors = {
      1: '#ff595e', 2: '#ff924c', 3: '#ffca3a', 4: '#8ac926', 
      5: '#52a675', 6: '#1982c4', 7: '#4267ac', 8: '#6a4c93', 9: '#b565a7'
    };
    return colors[val] || '#ccc';
  }

  let currentX = 2;
  let currentY = 0;
  let currentVal = getRandomNumber();
  let nextVal = getRandomNumber();
  let nextNextVal = getRandomNumber();
  let dropCounter = 0;
  let dropInterval = 1000;
  let lastTime = 0;
  let isResolving = false;

  let activeBlockEl = createBlockElement(currentX, currentY, currentVal);
  boardEl.appendChild(activeBlockEl);
  updateNextPiece();

  function createBlockElement(x, y, val, isNext = false) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.innerText = val;
    el.style.backgroundColor = getColor(val);
    if (!isNext) {
      el.style.left = (x * CELL_SIZE) + 'px';
      el.style.top = (y * CELL_SIZE) + 'px';
    } else {
      el.style.left = '0px';
      el.style.top = '0px';
    }
    return el;
  }

  function updateNextPiece() {
    nextContainer.innerHTML = '';
    const nextEl = createBlockElement(0, 0, nextVal, true);
    nextContainer.appendChild(nextEl);

    nextNextContainer.innerHTML = '';
    const nextNextEl = createBlockElement(0, 0, nextNextVal, true);
    nextNextContainer.appendChild(nextNextEl);
  }

  function move(dx, dy) {
    if (isResolving) return false;
    const newX = currentX + dx;
    const newY = currentY + dy;
    
    if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
    if (newY >= 0 && board[newY][newX] !== null) return false;
    
    currentX = newX;
    currentY = newY;
    activeBlockEl.style.left = (currentX * CELL_SIZE) + 'px';
    activeBlockEl.style.top = (currentY * CELL_SIZE) + 'px';
    return true;
  }

  function lock() {
    board[currentY][currentX] = { val: currentVal, el: activeBlockEl };
    isResolving = true;
    resolveMatches().then(() => {
      currentX = Math.floor(COLS / 2) - 1;
      currentY = 0;
      currentVal = nextVal;
      nextVal = nextNextVal;
      nextNextVal = getRandomNumber();
      updateNextPiece();
      
      if (board[currentY][currentX] !== null) {
        alert("ゲームオーバー！ スコア: " + score);
        resetGame();
      } else {
        activeBlockEl = createBlockElement(currentX, currentY, currentVal);
        boardEl.appendChild(activeBlockEl);
        isResolving = false;
      }
    });
  }

  function spawnParticles(x, y) {
    const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#fff'];
    const startX = x * CELL_SIZE + CELL_SIZE / 2 - 5;
    const startY = y * CELL_SIZE + CELL_SIZE / 2 - 5;

    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = startX + 'px';
      p.style.top = startY + 'px';
      boardEl.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 80;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      p.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 500 + Math.random() * 300,
        easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
      }).onfinish = () => p.remove();
    }
  }

  async function resolveMatches() {
    let hasMatch = true;
    let chainCount = 0;

    while(hasMatch) {
      hasMatch = false;
      let toRemove = [];
      
      for(let y = 0; y < ROWS; y++) {
        for(let startX = 0; startX < COLS - 1; startX++) {
          let sum = 0;
          let currentLine = [];
          for(let x = startX; x < COLS; x++) {
            let cell = board[y][x];
            if(!cell) break; 
            
            sum += cell.val;
            currentLine.push({x: x, y: y});
            
            if(sum === 10 && currentLine.length >= 2) {
              toRemove.push(...currentLine);
              break; 
            } else if (sum > 10) {
              break; 
            }
          }
        }
      }

      for(let x = 0; x < COLS; x++) {
        for(let startY = 0; startY < ROWS - 1; startY++) {
          let sum = 0;
          let currentLine = [];
          for(let y = startY; y < ROWS; y++) {
            let cell = board[y][x];
            if(!cell) break;
            
            sum += cell.val;
            currentLine.push({x: x, y: y});
            
            if(sum === 10 && currentLine.length >= 2) {
              toRemove.push(...currentLine);
              break;
            } else if (sum > 10) {
              break;
            }
          }
        }
      }

      if(toRemove.length > 0) {
        hasMatch = true;
        chainCount++;
        
        toRemove = toRemove.filter((v,i,a)=>a.findIndex(t=>(t.x === v.x && t.y===v.y))===i);
        
        boardEl.classList.remove('board-shake');
        void boardEl.offsetWidth; 
        boardEl.classList.add('board-shake');
        
        toRemove.forEach(p => {
          if(board[p.y][p.x]) {
             board[p.y][p.x].el.classList.add('flash');
             spawnParticles(p.x, p.y); 
             score += (10 * chainCount); 
          }
        });
        scoreEl.innerText = score;
        
        await new Promise(r => setTimeout(r, 500));

        toRemove.forEach(p => {
          if(board[p.y][p.x]) {
            boardEl.removeChild(board[p.y][p.x].el);
            board[p.y][p.x] = null;
          }
        });

        await applyGravity();
      }
    }
  }

  async function applyGravity() {
    let moved = false;
    for(let x = 0; x < COLS; x++) {
      for(let y = ROWS - 2; y >= 0; y--) {
        if(board[y][x]) {
          let targetY = y;
          while(targetY + 1 < ROWS && board[targetY + 1][x] === null) {
            targetY++;
          }
          if(targetY !== y) {
            board[targetY][x] = board[y][x];
            board[y][x] = null;
            board[targetY][x].el.style.top = (targetY * CELL_SIZE) + 'px';
            moved = true;
          }
        }
      }
    }
    if(moved) {
      await new Promise(r => setTimeout(r, 200)); 
    }
  }

  function resetGame() {
    board.forEach(row => row.forEach(cell => {
      if(cell) boardEl.removeChild(cell.el);
    }));
    if(activeBlockEl && activeBlockEl.parentNode) {
      boardEl.removeChild(activeBlockEl);
    }
    board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    score = 0;
    scoreEl.innerText = score;
    currentX = Math.floor(COLS / 2) - 1;
    currentY = 0;
    
    currentVal = getRandomNumber();
    nextVal = getRandomNumber();
    nextNextVal = getRandomNumber();
    
    activeBlockEl = createBlockElement(currentX, currentY, currentVal);
    boardEl.appendChild(activeBlockEl);
    updateNextPiece();
    isResolving = false;
  }

  function update(time = 0) {
    if(!isResolving) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        if (!move(0, 1)) {
          lock();
        }
        dropCounter = 0;
      }
    } else {
      lastTime = time;
    }
    requestAnimationFrame(update);
  }

  // --- 操作イベントの登録 ---
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft') { move(-1, 0); } 
    else if (event.key === 'ArrowRight') { move(1, 0); } 
    else if (event.key === 'ArrowDown') { move(0, 1); dropCounter = 0; }
  });

  // ボタン操作処理 (pointerdownでスマホのタッチとPCのクリックを統合)
  const setupButton = (id, dx, dy, resetDrop) => {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); // スマホでの長押し選択やズームを防止
      move(dx, dy);
      if(resetDrop) dropCounter = 0;
    });
  };

  setupButton('btn-left', -1, 0, false);
  setupButton('btn-right', 1, 0, false);
  setupButton('btn-down', 0, 1, true);

  update();
</script>
</body>
</html>
